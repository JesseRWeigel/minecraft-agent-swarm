name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 AppArmor otherwise permits the user namespace but strips
      # CAP_NET_ADMIN before Bubblewrap can initialize its isolated loopback.
      - name: Enable unprivileged sandbox namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsup is esbuild-based and never typechecks; tests only import what
      # they test. An undefined name in actions.ts shipped and broke every
      # skill invocation at runtime for an hour before a log line caught it.
      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Qualify generated-skill containment
        run: npm run test:sandbox
