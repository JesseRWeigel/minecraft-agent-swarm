name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 AppArmor otherwise permits the user namespace but strips
      # CAP_NET_ADMIN before Bubblewrap can initialize its isolated loopback.
      - name: Enable unprivileged sandbox namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsup is esbuild-based and never typechecks; tests only import what
      # they test. An undefined name in actions.ts shipped and broke every
      # skill invocation at runtime for an hour before a log line caught it.
      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Preserve partial observations on a real RCON query stall
        run: node --test tools/pilot/protected-rcon-stall.test.mjs

      - name: Test oak-log observer and predicate components
        run: node --test tools/pilot/oak-inventory.test.mjs tools/pilot/oak-task.test.mjs

      - name: Qualify generated-skill containment
        run: npm run test:sandbox

      - name: Qualify isolated pilot network and filesystem
        env:
          PILOT_TEST_BWRAP: /usr/bin/bwrap
        run: python3 -m unittest tools.pilot.test_server.SandboxLauncherTests.test_real_bwrap_hides_host_clears_secret_blocks_outbound_and_writes_runtime tools.pilot.test_shared_namespace tools.pilot.test_nested_participant_namespace tools.pilot.test_protected_namespace

  dataset-and-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pilot suite includes a real Python-to-Node pipe handshake with a
      # fake bot. No npm dependencies, Minecraft server, or model are needed.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test dataset, study safeguards, and offline benchmark
        run: |
          python3 -m unittest discover -s tools/dataset
          python3 -m unittest discover -s tools/ops
          python3 -m unittest discover -s tools/benchmark
          python3 -m unittest discover -s tools/pilot
      - name: Check study shell syntax
        run: bash -n scripts/launch-context.sh scripts/ops-mode.sh scripts/ops-state.sh scripts/run-swarm.sh scripts/swarm-health.sh scripts/backup-world.sh
